<title>تمارين أنواع المد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* التخطيط: عمود واحد ضيق للهاتف، بطاقة سؤال واحدة في كل مرة، شريط تقدم في الأعلى */
:root {
  --bg: #f1f4f7;
  --surface: #ffffff;
  --fg: #162033;
  --muted: #566277;
  --line: #d6dce6;
  --accent: #1b6a65;
  --accent-fg: #ffffff;
  --accent-soft: #e1f0ee;
  --good: #1b7a44;
  --good-soft: #e0f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --gold: #8f630a;
  --font-display: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-body: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1521; --surface: #172030; --fg: #e8edf5; --muted: #9ba7ba; --line: #2a3548;
    --accent: #4fc2b8; --accent-fg: #0a1a19; --accent-soft: #123130;
    --good: #61d18c; --good-soft: #12301f; --bad: #ff8b82; --bad-soft: #3b1917; --gold: #e3b24d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1521; --surface: #172030; --fg: #e8edf5; --muted: #9ba7ba; --line: #2a3548;
  --accent: #4fc2b8; --accent-fg: #0a1a19; --accent-soft: #123130;
  --good: #61d18c; --good-soft: #12301f; --bad: #ff8b82; --bad-soft: #3b1917; --gold: #e3b24d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.75;
  direction: rtl; padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-direction: column; gap: 4px; }
.kicker { font-size: 13px; letter-spacing: .04em; color: var(--gold); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.4; margin: 0; text-wrap: balance; font-weight: 700; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ayah { font-family: var(--font-display); font-size: 1.28em; line-height: 1.9; color: var(--accent); font-weight: 400; }
.qtext { font-size: 18px; font-weight: 500; line-height: 1.9; margin: 0; }
.qtype { font-size: 12.5px; color: var(--muted); letter-spacing: .04em; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
label.lbl { font-weight: 500; font-size: 15px; }
input[type=text] { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); }
input[type=text]:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
button, a.btn { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; text-align: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: 12px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 16px; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .opt:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: right; min-height: 52px; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font-size: 17px; line-height: 1.7; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tfrow .opt { text-align: center; font-weight: 600; }
.fb { border-radius: 12px; padding: 12px 14px; font-size: 15.5px; line-height: 1.85; }
.fb.ok { background: var(--good-soft); color: var(--fg); border: 1px solid var(--good); }
.fb.no { background: var(--bad-soft); color: var(--fg); border: 1px solid var(--bad); }
.fb b { display: block; margin-bottom: 2px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.cols .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chip { text-align: center; min-height: 48px; padding: 8px 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font-size: 15.5px; line-height: 1.6; overflow-wrap: anywhere; }
.chip.sel { border-color: var(--accent); background: var(--accent-soft); }
.chip.done { border-color: var(--good); background: var(--good-soft); cursor: default; }
.chip.shake { border-color: var(--bad); background: var(--bad-soft); }
.chip:disabled { cursor: default; }
.slots { display: flex; flex-direction: column; gap: 8px; }
.slot { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border: 1.5px dashed var(--line); border-radius: 12px; }
.slot .n { width: 28px; height: 28px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 14px; font-weight: 600; flex: none; }
.slot .chip { flex: 1; }
.slot.ok { border-color: var(--good); } .slot.no { border-color: var(--bad); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.pool .chip { flex: 1 1 auto; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font-family: var(--font-display); font-size: 56px; line-height: 1.2; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.score .of { font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.review { display: flex; flex-direction: column; gap: 12px; }
.rev { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.rev .rn { font-size: 13px; color: var(--bad); font-weight: 600; }
.rev p { margin: 0; font-size: 15.5px; }
.rev .good { color: var(--good); font-weight: 600; }
.actions { display: flex; flex-direction: column; gap: 10px; }
textarea.msg { width: 100%; min-height: 120px; font: inherit; font-size: 15px; line-height: 1.8; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); resize: vertical; }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<script>
(function () {
  var DATA = [{"t":"mcq","q":"ما تعريف المد الطبيعي؟","o":["ما لا تقوم ذات حرف المد إلا به، ولا يتوقف على همز أو سكون","ما جاء بعد حرف المد فيه همزة في كلمة واحدة","ما جاءت فيه الهمزة قبل حرف المد","ما جاء حرف المد فيه في آخر كلمة وبعده همزة في الكلمة التالية"],"a":0,"why":"المد الطبيعي هو الأصل الذي تقوم به ذات حرف المد، فلو حُذف لم يبقَ الحرف. ولا يتوقف على سبب من همز أو سكون."},{"t":"mcq","q":"لماذا سُمّي المد الطبيعي بهذا الاسم؟","o":["لأن صاحب الطبع السليم لا ينقصه ولا يزيده عن حدّه","لأن سببه الهمز","لأنه يُمد ست حركات","لأنه لا يقع إلا في آخر الكلمة"],"a":0,"why":"سُمّي طبيعياً لأن صاحب الطبع السليم لا ينقصه عن حدّه ولا يزيده عليه."},{"t":"mcq","q":"ما مقدار المد الطبيعي؟","o":["حركتان","أربع حركات","ست حركات","حركة واحدة"],"a":0,"why":"المد الطبيعي مقداره حركتان، ولا تجوز الزيادة عليه."},{"t":"mcq","q":"متى يكون المد منفصلاً؟","o":["إذا جاء حرف المد في آخر كلمة، وجاءت بعده همزة في أول الكلمة التي تليها","إذا اجتمع حرف المد والهمزة في كلمة واحدة","إذا جاءت الهمزة قبل حرف المد","إذا جاء بعد حرف المد سكون لازم"],"a":0,"why":"سُمّي منفصلاً لانفصال حرف المد عن الهمزة، فكل منهما في كلمة."},{"t":"mcq","q":"ما حكم المد المنفصل ومقداره؟","o":["جائز: أربع أو خمس حركات، ويجوز القصر حركتين","واجب: أربع أو خمس حركات","جائز: ست حركات دائماً","واجب: حركتان"],"a":0,"why":"المد المنفصل جائز، فيُمد أربع أو خمس حركات، ويجوز فيه القصر بمقدار حركتين."},{"t":"mcq","q":"ما حكم المد المتصل ومقداره؟","o":["واجب: أربع أو خمس حركات وصلاً، وست حركات وقفاً","جائز: حركتان وصلاً وأربع حركات وقفاً","واجب: حركتان وصلاً ووقفاً","جائز: أربع أو خمس حركات وصلاً فقط"],"a":0,"why":"المد المتصل واجب، ومقداره أربع أو خمس حركات في الوصل، وست حركات في الوقف."},{"t":"mcq","q":"لماذا سُمّي المد المتصل واجباً؟","o":["لأن القراء أجمعوا على مده فلا يجوز قصره","لأنه يأتي في أول السورة","لأن مقداره ست حركات دائماً","لأنه لا يكون إلا في الأفعال"],"a":0,"why":"سُمّي واجباً لاتفاق القراء على مده بمقدار زائد على الطبيعي، فلا يجوز قصره إلى حركتين."},{"t":"mcq","q":"كيف يُعرَّف مد البدل؟","o":["أن تأتي الهمزة قبل حرف المد، ولا يأتي بعد حرف المد همز ولا سكون","أن تأتي الهمزة بعد حرف المد في كلمة واحدة","أن يأتي حرف المد في آخر كلمة وبعده همزة في الكلمة التالية","أن يأتي بعد حرف المد سكون لازم"],"a":0,"why":"مد البدل: همزة قبل حرف المد، مثل «ءَامَنَ» و«ءَادَمَ» و«أُوتِيَ»."},{"t":"mcq","q":"لماذا سُمّي مد البدل بهذا الاسم؟","o":["لأن حرف المد مبدل في الأصل من همزة ساكنة","لأنه يحل محل المد المتصل","لأن الهمزة تُبدل ياءً عند الوقف دائماً","لأنه يُمد ست حركات بدلاً من حركتين"],"a":0,"why":"أصل «ءَامَنَ» هو «أَأْمَنَ»، فأُبدلت الهمزة الساكنة الثانية ألفاً، وكذلك «أُوتِيَ» أصلها «أُؤْتِيَ»."},{"t":"mcq","q":"ما مقدار مد البدل في رواية حفص عن عاصم؟","o":["حركتان","أربع حركات","ست حركات","ثلاث حركات"],"a":0,"why":"مد البدل في رواية حفص مقداره حركتان، فهو كالمد الطبيعي في المقدار."},{"t":"tf","q":"المد المنفصل واجب باتفاق القراء.","o":["صح","خطأ"],"a":1,"why":"المد المنفصل جائز، والواجب هو المد المتصل."},{"t":"mcq","q":"ما نوع المد في قوله تعالى: «قَالَ رَبِّ» (في الوصل)؟","o":["مد طبيعي","مد منفصل","مد متصل","مد بدل"],"a":0,"why":"جاءت ألف المد بعد فتحة، ولم يأتِ بعدها همز ولا سكون، فهو مد طبيعي."},{"t":"mcq","q":"ما نوع المد في قوله تعالى: «بِمَا أُنزِلَ إِلَيْكَ»؟","o":["مد منفصل","مد طبيعي","مد متصل","مد بدل"],"a":0,"why":"حرف المد (الألف) في آخر كلمة «مَا»، والهمزة في أول كلمة «أُنزِلَ»، فهما في كلمتين، فهو مد منفصل."},{"t":"mcq","q":"ما نوع المد في كلمة «السَّمَاءِ»؟","o":["مد متصل","مد منفصل","مد طبيعي","مد بدل"],"a":0,"why":"حرف المد (الألف) والهمزة بعده في كلمة واحدة، فهو مد متصل."},{"t":"mcq","q":"ما نوع المد في كلمة «ءَادَمَ»؟","o":["مد بدل","مد متصل","مد منفصل","مد طبيعي"],"a":0,"why":"جاءت الهمزة قبل حرف المد (الألف)، ولم يأتِ بعده همز ولا سكون، فهو مد بدل."},{"t":"mcq","q":"ما نوع المد في قوله تعالى: «قُوا أَنفُسَكُمْ»؟","o":["مد منفصل","مد متصل","مد بدل","مد طبيعي"],"a":0,"why":"حرف المد (الواو) في آخر كلمة «قُوا»، والهمزة في أول كلمة «أَنفُسَكُمْ»، فهو مد منفصل."},{"t":"mcq","q":"ما نوع المد في كلمة «أُوتِيَ»؟","o":["مد بدل","مد متصل","مد منفصل","مد طبيعي"],"a":0,"why":"جاءت الهمزة المضمومة قبل الواو التي هي حرف المد، فهو مد بدل."},{"t":"mcq","q":"أي العبارات الآتية فيها مد بدل؟","o":["«ءَامَنَ»","«السَّمَاءِ»","«بِمَا أُنزِلَ»","«قَالَ رَبِّ»"],"a":0,"why":"«ءَامَنَ» همزة قبل حرف المد، فهو بدل. أما «السَّمَاءِ» فمتصل، و«بِمَا أُنزِلَ» منفصل، و«قَالَ رَبِّ» طبيعي."},{"t":"mcq","q":"أي الكلمات الآتية فيها مد متصل؟","o":["«جَاءَ»","«ءَامَنَ»","«بِمَا أُنزِلَ»","«قَالَ رَبِّ»"],"a":0,"why":"في «جَاءَ» حرف المد والهمزة بعده في كلمة واحدة، فهو متصل."},{"t":"tf","q":"في كلمة «ءَادَمَ» جاءت الهمزة قبل حرف المد، فالمد فيها مد بدل.","o":["صح","خطأ"],"a":0,"why":"الهمزة قبل حرف المد ولا يتبعه همز ولا سكون، وهذا هو مد البدل."},{"t":"tf","q":"المد في «بِمَا أُنزِلَ» مد متصل لأن الهمزة جاءت بعد حرف المد.","o":["صح","خطأ"],"a":1,"why":"الهمزة جاءت بعد حرف المد، لكن في كلمة أخرى، فهو منفصل وليس متصلاً."},{"t":"match","q":"صِل كل نوع من المد بتعريفه:","pairs":[["المد الطبيعي","لا يأتي بعد حرف المد همز ولا سكون"],["المد المنفصل","حرف المد في آخر كلمة والهمزة في أول التي بعدها"],["المد المتصل","حرف المد والهمزة بعده في كلمة واحدة"],["مد البدل","الهمزة قبل حرف المد"]],"why":"انظر إلى موضع الهمزة بالنسبة إلى حرف المد، وهل هما في كلمة واحدة أو في كلمتين."},{"t":"match","q":"صِل كل نوع من المد بمثاله:","pairs":[["المد الطبيعي","«قَالَ رَبِّ»"],["المد المنفصل","«بِمَا أُنزِلَ»"],["المد المتصل","«السَّمَاءِ»"],["مد البدل","«ءَادَمَ»"]],"why":"حدد حرف المد أولاً، ثم انظر هل قبله همزة أو بعده همزة في الكلمة نفسها أو في التي تليها."},{"t":"order","q":"رتّب خطوات الحكم على المد في الكلمة:","items":["أحدد حرف المد في الكلمة","أنظر إلى ما قبله وما بعده: همزة أم لا شيء","أسمّي نوع المد وأطبق مقداره"],"why":"نحدد حرف المد أولاً، ثم ننظر إلى ما حوله، ثم نسمي النوع ونطبق مقداره."}];
  var META = { title: "تمارين أنواع المد", no: "٤", lesson: "المد الطبيعي والمنفصل والمتصل والبدل" };
  // رقم واتساب المعلم بالصيغة الدولية بلا + (مثال: 32470123456). اتركه فارغاً ليختار الطالب جهة الإرسال بنفسه.
  var TEACHER_PHONE = "";

  var stage = document.getElementById("stage");
  var name = "", qs = [], i = 0, log = [];

  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function fmt(s) { return esc(s).replace(/«([^»]+)»/g, '<span class="ayah">$1</span>'); }
  function plain(s) { return String(s).replace(/[«»]/g, ""); }
  function ar(n) { return String(n).replace(/\d/g, function (d) { return "٠١٢٣٤٥٦٧٨٩"[d]; }); }
  function shuffle(a) { var b = a.slice(); for (var k = b.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = b[k]; b[k] = b[j]; b[j] = t; } return b; }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
  function mount(node) { stage.replaceChildren(node); }

  /* ---------- البداية ---------- */
  function start() {
    var n = DATA.length;
    var card = el(
      '<section class="card">' +
      '<p class="sub">' + ar(n) + ' سؤالاً في هذا الدرس، وتظهر الإجابة الصحيحة مع الشرح بعد كل سؤال. في آخر التمرين تُرسل نتيجتك إلى المعلم.</p>' +
      '<div><label class="lbl" for="nm">اكتب اسمك</label>' +
      '<input type="text" id="nm" autocomplete="name" placeholder="الاسم الكامل" maxlength="60"></div>' +
      '<button class="btn" id="go" disabled>ابدأ التمرين</button>' +
      '</section>'
    );
    mount(card);
    var inp = card.querySelector("#nm"), go = card.querySelector("#go");
    inp.addEventListener("input", function () { go.disabled = inp.value.trim().length < 2; });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter" && !go.disabled) go.click(); });
    go.addEventListener("click", function () {
      name = inp.value.trim(); qs = DATA.slice(); i = 0; log = []; showQ();
    });
  }

  /* ---------- شريط التقدم ---------- */
  function top() {
    return '<div><div class="meta"><span>السؤال ' + ar(i + 1) + ' من ' + ar(qs.length) + '</span><span>' + esc(name) + '</span></div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + qs.length + '" aria-valuenow="' + i + '"><i style="width:' + (i / qs.length * 100) + '%"></i></div></div>';
  }
  function nextBtn(card, cb) {
    var last = i === qs.length - 1;
    var b = el('<button class="btn">' + (last ? "عرض النتيجة" : "السؤال التالي") + '</button>');
    b.addEventListener("click", cb);
    card.appendChild(b);
    b.focus({ preventScroll: true });
    b.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  function advance() { i++; if (i >= qs.length) finish(); else showQ(); }
  function feedback(card, ok, extra, why) {
    var f = el('<div class="fb ' + (ok ? "ok" : "no") + '" role="status"><b>' + (ok ? "أحسنت، إجابة صحيحة" : "إجابة غير صحيحة") + '</b>' + (extra ? '<div>' + extra + '</div>' : "") + (why ? '<div>' + fmt(why) + '</div>' : "") + '</div>');
    card.appendChild(f);
  }

  function showQ() {
    var q = qs[i];
    var typeLabel = { mcq: "اختيار من متعدد", tf: "صح أم خطأ", match: "وصل", order: "ترتيب" }[q.t];
    var card = el('<section class="card">' + top() + '<span class="qtype">' + typeLabel + '</span><p class="qtext">' + fmt(q.q) + '</p></section>');
    mount(card);
    if (q.t === "mcq" || q.t === "tf") mcq(card, q);
    else if (q.t === "match") match(card, q);
    else order(card, q);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- اختيار من متعدد وصح/خطأ ---------- */
  function mcq(card, q) {
    var opts = q.o.map(function (t, k) { return { t: t, ok: k === q.a }; });
    if (q.t === "mcq") opts = shuffle(opts);
    var wrap = el('<div class="' + (q.t === "tf" ? "tfrow" : "opts") + '"></div>');
    var btns = opts.map(function (o) {
      var b = el('<button class="opt">' + fmt(o.t) + '</button>');
      wrap.appendChild(b);
      return b;
    });
    card.appendChild(wrap);
    btns.forEach(function (b, k) {
      b.addEventListener("click", function () {
        btns.forEach(function (x, m) { x.disabled = true; if (opts[m].ok) x.classList.add("ok"); });
        var ok = opts[k].ok;
        if (!ok) b.classList.add("no");
        var correct = opts.filter(function (o) { return o.ok; })[0].t;
        log.push({ n: i + 1, q: q.q, ok: ok, chosen: opts[k].t, correct: correct, why: q.why });
        feedback(card, ok, ok ? "" : 'الإجابة الصحيحة: ' + fmt(correct), q.why);
        nextBtn(card, advance);
      });
    });
  }

  /* ---------- وصل ---------- */
  function match(card, q) {
    var n = q.pairs.length, done = 0, mistakes = 0, sel = null;
    var L = q.pairs.map(function (p, k) { return { k: k, t: p[0] }; });
    var R = shuffle(q.pairs.map(function (p, k) { return { k: k, t: p[1] }; }));
    card.appendChild(el('<p class="hint">اضغط على عنصر من العمود الأول، ثم على ما يناسبه من العمود الثاني.</p>'));
    var cols = el('<div class="cols"><div class="col" id="lc"></div><div class="col" id="rc"></div></div>');
    card.appendChild(cols);
    var lc = cols.querySelector("#lc"), rc = cols.querySelector("#rc");
    var lb = L.map(function (o) { var b = el('<button class="chip">' + fmt(o.t) + '</button>'); b.dataset.k = o.k; lc.appendChild(b); return b; });
    var rb = R.map(function (o) { var b = el('<button class="chip">' + fmt(o.t) + '</button>'); b.dataset.k = o.k; rc.appendChild(b); return b; });
    lb.forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.classList.contains("done")) return;
        lb.forEach(function (x) { x.classList.remove("sel"); });
        b.classList.add("sel"); sel = b;
      });
    });
    rb.forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.classList.contains("done") || !sel) return;
        if (sel.dataset.k === b.dataset.k) {
          sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done");
          sel.disabled = true; b.disabled = true; sel = null; done++;
          if (done === n) finishMatch();
        } else {
          mistakes++; b.classList.add("shake");
          setTimeout(function () { b.classList.remove("shake"); }, 600);
        }
      });
    });
    function finishMatch() {
      var ok = mistakes === 0;
      var correct = q.pairs.map(function (p) { return plain(p[0]) + " ← " + plain(p[1]); }).join(" | ");
      log.push({ n: i + 1, q: q.q, ok: ok, chosen: ok ? "" : "أخطأت " + ar(mistakes) + " مرات أثناء الوصل", correct: correct, why: q.why });
      feedback(card, ok, ok ? "" : "وصلت العناصر كلها في النهاية، لكن مع " + ar(mistakes) + " محاولات خاطئة، لذلك لا تُحسب النقطة.", q.why);
      nextBtn(card, advance);
    }
  }

  /* ---------- ترتيب ---------- */
  function order(card, q) {
    var n = q.items.length;
    var items = q.items.map(function (t, k) { return { k: k, t: t }; });
    var pool = shuffle(items);
    var guard = 0;
    while (guard++ < 10 && pool.every(function (o, k) { return o.k === k; })) pool = shuffle(items);
    var placed = [], locked = false;
    card.appendChild(el('<p class="hint">اضغط على العناصر بالترتيب الصحيح. اضغط على عنصر موضوع لإرجاعه.</p>'));
    var slots = el('<div class="slots"></div>'); card.appendChild(slots);
    var poolEl = el('<div class="pool"></div>'); card.appendChild(poolEl);
    var chk = el('<button class="btn" disabled>تحقق من الترتيب</button>'); card.appendChild(chk);
    function draw() {
      slots.replaceChildren();
      for (var s = 0; s < n; s++) {
        var o = placed[s];
        var slot = el('<div class="slot"><span class="n">' + ar(s + 1) + '</span></div>');
        if (o) {
          var c = el('<button class="chip">' + fmt(o.t) + '</button>');
          (function (o) { c.addEventListener("click", function () { if (locked) return; placed = placed.filter(function (x) { return x !== o; }); pool.push(o); draw(); }); })(o);
          slot.appendChild(c);
        }
        slots.appendChild(slot);
      }
      poolEl.replaceChildren();
      pool.forEach(function (o) {
        var c = el('<button class="chip">' + fmt(o.t) + '</button>');
        c.addEventListener("click", function () { if (locked) return; pool = pool.filter(function (x) { return x !== o; }); placed.push(o); draw(); });
        poolEl.appendChild(c);
      });
      chk.disabled = placed.length !== n;
    }
    draw();
    chk.addEventListener("click", function () {
      locked = true; chk.remove();
      var ok = placed.every(function (o, k) { return o.k === k; });
      Array.prototype.forEach.call(slots.children, function (sl, k) { sl.classList.add(placed[k].k === k ? "ok" : "no"); });
      poolEl.remove();
      var correct = q.items.map(function (t, k) { return ar(k + 1) + ") " + plain(t); }).join("، ");
      log.push({ n: i + 1, q: q.q, ok: ok, chosen: placed.map(function (o) { return plain(o.t); }).join("، "), correct: correct, why: q.why });
      feedback(card, ok, ok ? "" : "الترتيب الصحيح: " + esc(correct), q.why);
      nextBtn(card, advance);
    });
  }

  /* ---------- النتيجة ---------- */
  function message(score, total, wrong) {
    var pct = Math.round(score / total * 100);
    var t = "السلام عليكم ورحمة الله.\nأنا: " + name + "\nالتمرين: الدرس " + META.no + " (" + META.lesson + ")\nنتيجتي: " + ar(score) + " من " + ar(total) + " (" + ar(pct) + "٪)";
    t += wrong.length ? "\nالأسئلة التي أخطأت فيها: " + wrong.map(function (w) { return ar(w.n); }).join("، ") : "\nلم أخطئ في أي سؤال، والحمد لله.";
    return t;
  }
  function finish() {
    var total = qs.length;
    var score = log.filter(function (l) { return l.ok; }).length;
    var wrong = log.filter(function (l) { return !l.ok; });
    var pct = score / total;
    var verdict = pct >= 0.9 ? "ممتاز، بارك الله فيك." : pct >= 0.7 ? "جيد جداً. راجع الأسئلة التي أخطأت فيها." : pct >= 0.5 ? "جيد. تحتاج إلى مراجعة الدرس ثم إعادة التمرين." : "راجع الدرس مع المعلم ثم أعد المحاولة.";
    var msg = message(score, total, wrong);
    var card = el('<section class="card"><span class="qtype">انتهى التمرين</span>' +
      '<div class="score"><span class="big">' + ar(score) + '</span><span class="of">من ' + ar(total) + '</span></div>' +
      '<p class="qtext">' + esc(name) + '، ' + verdict + '</p></section>');
    mount(card);

    var send = el('<section class="card"><h2>أرسل نتيجتك إلى المعلم</h2>' +
      '<p class="hint">النتيجة لا تصل إلى المعلم تلقائياً. اضغط زر واتساب لإرسال الرسالة، أو انسخها وأرسلها بأي تطبيق.</p>' +
      '<textarea class="msg" id="msg" readonly></textarea>' +
      '<div class="actions"><a class="btn" id="wa" target="_blank" rel="noopener">إرسال عبر واتساب</a>' +
      '<button class="btn ghost" id="cp">نسخ الرسالة</button></div></section>');
    var wrap = el('<div style="display:flex;flex-direction:column;gap:16px"></div>');
    wrap.appendChild(card); wrap.appendChild(send);
    stage.replaceChildren(wrap);
    var ta = send.querySelector("#msg"); ta.value = msg;
    send.querySelector("#wa").href = "https://wa.me/" + (TEACHER_PHONE || "") + "?text=" + encodeURIComponent(msg);
    var cp = send.querySelector("#cp");
    cp.addEventListener("click", function () {
      var done = function () { cp.textContent = "تم النسخ"; setTimeout(function () { cp.textContent = "نسخ الرسالة"; }, 1800); };
      var fallback = function () { ta.focus(); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { cp.textContent = "حدّد الرسالة وانسخها يدوياً"; } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(done, fallback); else fallback();
    });

    if (wrong.length) {
      var rev = el('<section class="card"><h2>مراجعة الأخطاء</h2><div class="review"></div></section>');
      var box = rev.querySelector(".review");
      wrong.forEach(function (w) {
        box.appendChild(el('<div class="rev"><span class="rn">السؤال ' + ar(w.n) + '</span><p>' + fmt(w.q) + '</p>' +
          (w.chosen ? '<p>إجابتك: ' + fmt(w.chosen) + '</p>' : "") +
          '<p class="good">الصحيح: ' + fmt(w.correct) + '</p>' +
          (w.why ? '<p>' + fmt(w.why) + '</p>' : "") + '</div>'));
      });
      wrap.appendChild(rev);
    }
    var again = el('<button class="btn ghost">إعادة التمرين</button>');
    again.addEventListener("click", function () { qs = shuffle(DATA); i = 0; log = []; showQ(); });
    wrap.appendChild(again);
    window.scrollTo({ top: 0 });
  }

  start();
})();
</script>
