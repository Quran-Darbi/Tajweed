<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تمارين الاستعاذة والبسملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* التخطيط: عمود واحد ضيق للهاتف، زر الرئيسية في الأعلى، بطاقة سؤال واحدة، وتحتها زرا السابق والتالي */
:root {
  --bg: #f1f4f7;
  --surface: #ffffff;
  --fg: #162033;
  --muted: #566277;
  --line: #d6dce6;
  --accent: #1b6a65;
  --accent-fg: #ffffff;
  --accent-soft: #e1f0ee;
  --good: #1b7a44;
  --good-soft: #e0f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --gold: #8f630a;
  --font-display: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-body: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1521; --surface: #172030; --fg: #e8edf5; --muted: #9ba7ba; --line: #2a3548;
    --accent: #4fc2b8; --accent-fg: #0a1a19; --accent-soft: #123130;
    --good: #61d18c; --good-soft: #12301f; --bad: #ff8b82; --bad-soft: #3b1917; --gold: #e3b24d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1521; --surface: #172030; --fg: #e8edf5; --muted: #9ba7ba; --line: #2a3548;
  --accent: #4fc2b8; --accent-fg: #0a1a19; --accent-soft: #123130;
  --good: #61d18c; --good-soft: #12301f; --bad: #ff8b82; --bad-soft: #3b1917; --gold: #e3b24d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.75;
  direction: rtl; padding-inline: 16px; padding-block: 16px 40px;
}
.wrap { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.flow { display: flex; flex-direction: column; gap: 16px; }
.topbar { display: flex; justify-content: flex-start; }
.home { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; font-weight: 600; font-size: 15px; }
.home svg { flex: none; color: var(--accent); }
.home:hover { border-color: var(--accent); background: var(--accent-soft); }
.home:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.leave { border-color: var(--bad); }
.head { display: flex; flex-direction: column; gap: 4px; }
.kicker { font-size: 13px; letter-spacing: .04em; color: var(--gold); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.4; margin: 0; text-wrap: balance; font-weight: 700; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ayah { font-family: var(--font-display); font-size: 1.28em; line-height: 1.9; color: var(--accent); font-weight: 400; }
.qtext { font-size: 18px; font-weight: 500; line-height: 1.9; margin: 0; }
.qtype { font-size: 12.5px; color: var(--muted); letter-spacing: .04em; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
label.lbl { font-weight: 500; font-size: 15px; }
input[type=text] { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); }
input[type=text]:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
button, a.btn { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; text-align: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: 12px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 16px; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .opt:focus-visible, .chip:focus-visible, .wrow:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.nav .btn { width: 100%; }
.revbar { display: flex; justify-content: space-between; color: var(--gold); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: right; min-height: 52px; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font-size: 17px; line-height: 1.7; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tfrow .opt { text-align: center; font-weight: 600; }
.fb { border-radius: 12px; padding: 12px 14px; font-size: 15.5px; line-height: 1.85; }
.fb.ok { background: var(--good-soft); color: var(--fg); border: 1px solid var(--good); }
.fb.no { background: var(--bad-soft); color: var(--fg); border: 1px solid var(--bad); }
.fb b { display: block; margin-bottom: 2px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.cols .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chip { text-align: center; min-height: 48px; padding: 8px 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font-size: 15.5px; line-height: 1.6; overflow-wrap: anywhere; }
.chip.sel { border-color: var(--accent); background: var(--accent-soft); }
.chip.done { border-color: var(--good); background: var(--good-soft); cursor: default; }
.chip.shake { border-color: var(--bad); background: var(--bad-soft); }
.chip:disabled { cursor: default; }
.slots { display: flex; flex-direction: column; gap: 8px; }
.slot { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border: 1.5px dashed var(--line); border-radius: 12px; }
.slot .n { width: 28px; height: 28px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 14px; font-weight: 600; flex: none; }
.slot .chip { flex: 1; }
.slot.ok { border-color: var(--good); } .slot.no { border-color: var(--bad); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.pool .chip { flex: 1 1 auto; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font-family: var(--font-display); font-size: 56px; line-height: 1.2; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.score .of { font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.review { display: flex; flex-direction: column; gap: 10px; }
.wrow { display: flex; flex-direction: column; gap: 2px; text-align: right; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.wrow:hover { border-color: var(--accent); background: var(--accent-soft); }
.wrow .rn { font-size: 13px; color: var(--bad); font-weight: 600; }
.wrow .wq { font-size: 15.5px; line-height: 1.8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.actions { display: flex; flex-direction: column; gap: 10px; }
textarea.msg { width: 100%; min-height: 120px; font: inherit; font-size: 15px; line-height: 1.8; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); resize: vertical; }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<div class="wrap" id="app">
  <div class="topbar">
    <a class="home" id="home" href="./">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5.5h4V20"/></svg>

    <div class="nav">
      <a class="btn" href="./">مغادرة</a>
      <button class="btn ghost" id="stay" type="button">متابعة التمرين</button>
    </div>
  </div>
  <header class="head">
    <span class="kicker">الدرس ١</span>
    <h1>أحكام الاستعاذة والبسملة وتعريف التجويد واللحون</h1>
  </header>
  <div id="stage"></div>
</div>

<script>
(function () {
  var DATA = [{"t":"mcq","q":"ما معنى التجويد في اللغة؟","o":["التحسين والإتقان","الحفظ والتكرار","السرعة في القراءة","التفسير والتأويل"],"a":0,"why":"التجويد في اللغة: التحسين، يقال: جوّد فلان الشيء إذا أتى به جيداً."},{"t":"mcq","q":"ما تعريف التجويد في الاصطلاح؟","o":["إخراج كل حرف من مخرجه مع إعطائه حقه ومستحقه","قراءة القرآن بصوت جميل فقط","حفظ القرآن عن ظهر قلب","معرفة معاني آيات القرآن"],"a":0,"why":"التجويد اصطلاحاً: إخراج كل حرف من مخرجه، وإعطاؤه حقه ومستحقه من الصفات."},{"t":"mcq","q":"ما ثمرة علم التجويد؟","o":["صون اللسان عن اللحن في كلام الله تعالى","زيادة سرعة القراءة","تحسين الصوت فقط","معرفة أسباب النزول"],"a":0,"why":"ثمرة التجويد: صيانة اللسان عن الخطأ (اللحن) عند تلاوة كتاب الله."},{"t":"mcq","q":"ما حكم قراءة القرآن بأحكام التجويد (الجانب العملي)؟","o":["فرض عين على كل مسلم ومسلمة","مستحب فقط","مباح","خاص بالقراء المتخصصين"],"a":0,"why":"العمل بالتجويد عند القراءة فرض عين، أما تعلم تفاصيله العلمية وأدلته فهو فرض كفاية. قال تعالى: «وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا»."},{"t":"mcq","q":"اللحن في القراءة معناه:","o":["الخطأ والميل عن الصواب","الصوت الجميل","المد الطويل","الوقف على آخر الآية"],"a":0,"why":"اللحن لغة: الميل عن الصواب، وفي القراءة: الخطأ في النطق بالقرآن."},{"t":"mcq","q":"ما اللحن الجلي؟","o":["خطأ ظاهر يخل بالألفاظ أو المعاني ويعرفه عامة الناس","خطأ خفي لا يعرفه إلا المتخصصون","ترك المد الطبيعي فقط","الإسراع في القراءة"],"a":0,"why":"اللحن الجلي: خطأ ظاهر في اللفظ، كتغيير حرف بحرف أو حركة بحركة، وقد يغير المعنى. وهو محرّم."},{"t":"mcq","q":"قراءة «أَنْعَمْتَ» بضم التاء (أَنْعَمْتُ) تُعد:","o":["لحناً جلياً","لحناً خفياً","قراءة صحيحة","وقفاً جائزاً"],"a":0,"why":"تغيير حركة التاء من الفتح إلى الضم يغير المعنى (من المخاطَب إلى المتكلم)، فهو لحن جلي."},{"t":"tf","q":"ترك الغنة وتفخيم الحرف المرقق من اللحن الخفي.","o":["صح","خطأ"],"a":0,"why":"اللحن الخفي: خلل في إتقان الأداء لا يغيّر المعنى، ولا يعرفه إلا أهل الفن، كترك الغنة وتفخيم المرقق."},{"t":"mcq","q":"ما الصيغة المختارة للاستعاذة؟","o":["أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ","اللَّهُمَّ أَعِنِّي مِنَ الشَّيْطَانِ","بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ","أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ"],"a":0,"why":"الصيغة المختارة: «أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ»، وهي موافقة لقوله تعالى في سورة النحل: «فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ»."},{"t":"mcq","q":"ما حكم الاستعاذة عند ابتداء القراءة؟","o":["مستحبة (سنة)","واجبة تبطل القراءة بتركها","مكروهة","محرّمة"],"a":0,"why":"الاستعاذة مستحبة عند الجمهور عند ابتداء القراءة، والأمر في الآية للندب."},{"t":"mcq","q":"متى يُستحب الجهر بالاستعاذة؟","o":["عند القراءة جهراً بحضور من يستمع","في الصلاة السرية فقط","لا يُجهر بها أبداً","بعد الانتهاء من القراءة"],"a":0,"why":"يُجهر بها إذا كانت القراءة جهراً وهناك من يستمع إليها، ويُسرّ بها إذا كان القارئ يقرأ سراً أو في الصلاة."},{"t":"tf","q":"تأتي البسملة في أول كل سورة من القرآن بلا استثناء.","o":["صح","خطأ"],"a":1,"why":"سورة التوبة لا بسملة في أولها. وترد البسملة في القرآن أيضاً جزءاً من آية في سورة النمل."},{"t":"mcq","q":"ما السورة التي لا تبدأ بالبسملة؟","o":["التوبة","الأنفال","يونس","الفاتحة"],"a":0,"why":"سورة التوبة (وتسمى براءة) هي السورة التي ليس في أولها بسملة."},{"t":"mcq","q":"كم وجهاً جائزاً عند وصل الاستعاذة بالبسملة بأول السورة (عند الابتداء بأول سورة غير التوبة)؟","o":["وجهان","ثلاثة أوجه","أربعة أوجه","ستة أوجه"],"a":2,"why":"أربعة أوجه: قطع الجميع، وقطع الاستعاذة ووصل البسملة بأول السورة، ووصل الاستعاذة بالبسملة مع قطعها عن أول السورة، ووصل الجميع."},{"t":"mcq","q":"كم وجهاً جائزاً عند الانتقال من آخر سورة إلى أول التي تليها مع البسملة؟","o":["وجهان","ثلاثة أوجه","أربعة أوجه","خمسة أوجه"],"a":1,"why":"ثلاثة أوجه: قطع الجميع، وقطع آخر السورة ووصل البسملة بأول التالية، ووصل الجميع. والممنوع: وصل آخر السورة بالبسملة والوقف عليها."},{"t":"tf","q":"عند الابتداء من وسط السورة يجوز الإتيان بالبسملة ويجوز تركها.","o":["صح","خطأ"],"a":0,"why":"الابتداء من وسط السورة: القارئ مخيّر بين الإتيان بالبسملة وتركها، مع الاستعاذة قبل ذلك."},{"t":"match","q":"صِل كل مصطلح بمعناه أو مثاله:","pairs":[["التجويد لغة","التحسين"],["اللحن الجلي","تغيير حرف بحرف أو حركة بحركة"],["اللحن الخفي","ترك الغنة"],["الاستعاذة","أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ"],["البسملة","بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ"]],"why":"راجع تعريف التجويد واللحن، ثم صيغتي الاستعاذة والبسملة."},{"t":"order","q":"رتّب ما يُقال عند البدء بقراءة سورة من أولها (عدا التوبة):","items":["الاستعاذة","البسملة","الآية الأولى من السورة"],"why":"الترتيب: الاستعاذة ثم البسملة ثم أول السورة."}];
  var META = { title: "تمارين الاستعاذة والبسملة", no: "١", lesson: "أحكام الاستعاذة والبسملة وتعريف التجويد واللحون" };
  // رقم واتساب المعلم بالصيغة الدولية بلا + (مثال: 32470123456). اتركه فارغاً ليختار الطالب جهة الإرسال بنفسه.
  var TEACHER_PHONE = "";

  var stage = document.getElementById("stage");
  var homeLink = document.getElementById("home");
  var leaveBox = document.getElementById("leave");
  var stayBtn = document.getElementById("stay");
  var name = "", qs = [], i = 0, mode = "quiz";
  var res = [], cards = [], resultsNode = null, finished = false, reviewList = [], navNext = null;

  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function fmt(s) { return esc(s).replace(/«([^»]+)»/g, '<span class="ayah">$1</span>'); }
  function plain(s) { return String(s).replace(/[«»]/g, ""); }
  function ar(n) { return String(n).replace(/\d/g, function (d) { return "٠١٢٣٤٥٦٧٨٩"[d]; }); }
  function shuffle(a) { var b = a.slice(); for (var k = b.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = b[k]; b[k] = b[j]; b[j] = t; } return b; }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
  function mount(node) { stage.replaceChildren(node); }
  function flow() { return el('<div class="flow"></div>'); }
  function toTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }

  /* ---------- زر الصفحة الرئيسية: يسأل أولاً إن كان الطالب في منتصف التمرين ---------- */
  homeLink.addEventListener("click", function (e) {
    var inProgress = !finished && res.some(function (r) { return r; });
    if (!inProgress) return;
    e.preventDefault();
    leaveBox.hidden = false;
    leaveBox.scrollIntoView({ block: "nearest", behavior: "smooth" });
    stayBtn.focus({ preventScroll: true });
  });
  stayBtn.addEventListener("click", function () { leaveBox.hidden = true; });

  /* ---------- البداية ---------- */
  function start() {
    var n = DATA.length;
    var card = el(
      '<section class="card">' +
      '<p class="sub">' + ar(n) + ' سؤالاً في هذا الدرس، وتظهر الإجابة الصحيحة مع الشرح بعد كل سؤال. تستطيع الرجوع إلى الأسئلة السابقة، وفي آخر التمرين تُرسل نتيجتك إلى المعلم.</p>' +
      '<div><label class="lbl" for="nm">اكتب اسمك</label>' +
      '<input type="text" id="nm" autocomplete="name" placeholder="الاسم الكامل" maxlength="60"></div>' +
      '<button class="btn" id="go" disabled>ابدأ التمرين</button>' +
      '</section>'
    );
    mount(card);
    var inp = card.querySelector("#nm"), go = card.querySelector("#go");
    inp.addEventListener("input", function () { go.disabled = inp.value.trim().length < 2; });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter" && !go.disabled) go.click(); });
    go.addEventListener("click", function () { name = inp.value.trim(); begin(false); });
  }
  function begin(shuffled) {
    qs = shuffled ? shuffle(DATA) : DATA.slice();
    i = 0; res = []; cards = []; resultsNode = null; finished = false; reviewList = [];
    leaveBox.hidden = true;
    show(0);
  }

  /* ---------- بطاقة السؤال ---------- */
  function top(idx) {
    return '<div><div class="meta"><span>السؤال ' + ar(idx + 1) + ' من ' + ar(qs.length) + '</span><span>' + esc(name) + '</span></div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + qs.length + '" aria-valuenow="' + idx + '"><i style="width:' + (idx / qs.length * 100) + '%"></i></div></div>';
  }
  function feedback(card, ok, extra, why) {
    var f = el('<div class="fb ' + (ok ? "ok" : "no") + '" role="status"><b>' + (ok ? "أحسنت، إجابة صحيحة" : "إجابة غير صحيحة") + '</b>' + (extra ? '<div>' + extra + '</div>' : "") + (why ? '<div>' + fmt(why) + '</div>' : "") + '</div>');
    card.appendChild(f);
  }
  // تسجيل إجابة سؤال، وإظهار التصحيح، وتفعيل زر «التالي»
  function record(card, idx, r, extra) {
    res[idx] = r;
    feedback(card, r.ok, extra, r.why);
    if (idx === i && mode === "quiz" && navNext) {
      navNext.disabled = false;
      navNext.focus({ preventScroll: true });
      navNext.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }
  function buildCard(idx) {
    var q = qs[idx];
    var typeLabel = { mcq: "اختيار من متعدد", tf: "صح أم خطأ", match: "وصل", order: "ترتيب" }[q.t];
    var card = el('<section class="card">' + top(idx) + '<span class="qtype">' + typeLabel + '</span><p class="qtext">' + fmt(q.q) + '</p></section>');
    if (q.t === "mcq" || q.t === "tf") mcq(card, q, idx);
    else if (q.t === "match") match(card, q, idx);
    else order(card, q, idx);
    cards[idx] = card; // تبقى البطاقة محفوظة بحالتها لتعاد عند الرجوع إليها
    return card;
  }
  function show(idx) {
    mode = "quiz"; i = idx;
    var card = cards[idx] || buildCard(idx);
    var last = idx === qs.length - 1;
    var wrap = flow();
    wrap.appendChild(card);
    var bar = el('<div class="nav"><button class="btn ghost" type="button">السابق</button><button class="btn" type="button"></button></div>');
    var prev = bar.children[0], next = bar.children[1];
    next.textContent = last ? "عرض النتيجة" : "التالي";
    prev.disabled = idx === 0;
    next.disabled = !res[idx];
    prev.addEventListener("click", function () { show(idx - 1); });
    next.addEventListener("click", function () { if (last) finish(); else show(idx + 1); });
    navNext = next;
    wrap.appendChild(bar);
    mount(wrap);
    toTop();
  }

  /* ---------- اختيار من متعدد وصح/خطأ ---------- */
  function mcq(card, q, idx) {
    var opts = q.o.map(function (t, k) { return { t: t, ok: k === q.a }; });
    if (q.t === "mcq") opts = shuffle(opts);
    var wrap = el('<div class="' + (q.t === "tf" ? "tfrow" : "opts") + '"></div>');
    var btns = opts.map(function (o) {
      var b = el('<button class="opt" type="button">' + fmt(o.t) + '</button>');
      wrap.appendChild(b);
      return b;
    });
    card.appendChild(wrap);
    btns.forEach(function (b, k) {
      b.addEventListener("click", function () {
        btns.forEach(function (x, m) { x.disabled = true; if (opts[m].ok) x.classList.add("ok"); });
        var ok = opts[k].ok;
        if (!ok) b.classList.add("no");
        var correct = opts.filter(function (o) { return o.ok; })[0].t;
        record(card, idx, { n: idx + 1, q: q.q, ok: ok }, ok ? "" : 'الإجابة الصحيحة: ' + fmt(correct));
        res[idx].why = q.why;
      });
    });
  }

  /* ---------- وصل ---------- */
  function match(card, q, idx) {
    var n = q.pairs.length, done = 0, mistakes = 0, sel = null;
    var L = q.pairs.map(function (p, k) { return { k: k, t: p[0] }; });
    var R = shuffle(q.pairs.map(function (p, k) { return { k: k, t: p[1] }; }));
    card.appendChild(el('<p class="hint">اضغط على عنصر من العمود الأول، ثم على ما يناسبه من العمود الثاني.</p>'));
    var cols = el('<div class="cols"><div class="col" id="lc"></div><div class="col" id="rc"></div></div>');
    card.appendChild(cols);
    var lc = cols.querySelector("#lc"), rc = cols.querySelector("#rc");
    var lb = L.map(function (o) { var b = el('<button class="chip" type="button">' + fmt(o.t) + '</button>'); b.dataset.k = o.k; lc.appendChild(b); return b; });
    var rb = R.map(function (o) { var b = el('<button class="chip" type="button">' + fmt(o.t) + '</button>'); b.dataset.k = o.k; rc.appendChild(b); return b; });
    lb.forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.classList.contains("done")) return;
        lb.forEach(function (x) { x.classList.remove("sel"); });
        b.classList.add("sel"); sel = b;
      });
    });
    rb.forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.classList.contains("done") || !sel) return;
        if (sel.dataset.k === b.dataset.k) {
          sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done");
          sel.disabled = true; b.disabled = true; sel = null; done++;
          if (done === n) finishMatch();
        } else {
          mistakes++; b.classList.add("shake");
          setTimeout(function () { b.classList.remove("shake"); }, 600);
        }
      });
    });
    function finishMatch() {
      var ok = mistakes === 0;
      record(card, idx, { n: idx + 1, q: q.q, ok: ok, why: q.why }, ok ? "" : "وصلت العناصر كلها في النهاية، لكن مع " + ar(mistakes) + " محاولات خاطئة، لذلك لا تُحسب النقطة.");
    }
  }

  /* ---------- ترتيب ---------- */
  function order(card, q, idx) {
    var n = q.items.length;
    var items = q.items.map(function (t, k) { return { k: k, t: t }; });
    var pool = shuffle(items);
    var guard = 0;
    while (guard++ < 10 && pool.every(function (o, k) { return o.k === k; })) pool = shuffle(items);
    var placed = [], locked = false;
    card.appendChild(el('<p class="hint">اضغط على العناصر بالترتيب الصحيح. اضغط على عنصر موضوع لإرجاعه.</p>'));
    var slots = el('<div class="slots"></div>'); card.appendChild(slots);
    var poolEl = el('<div class="pool"></div>'); card.appendChild(poolEl);
    var chk = el('<button class="btn" type="button" disabled>تحقق من الترتيب</button>'); card.appendChild(chk);
    function draw() {
      slots.replaceChildren();
      for (var s = 0; s < n; s++) {
        var o = placed[s];
        var slot = el('<div class="slot"><span class="n">' + ar(s + 1) + '</span></div>');
        if (o) {
          var c = el('<button class="chip" type="button">' + fmt(o.t) + '</button>');
          (function (o) { c.addEventListener("click", function () { if (locked) return; placed = placed.filter(function (x) { return x !== o; }); pool.push(o); draw(); }); })(o);
          slot.appendChild(c);
        }
        slots.appendChild(slot);
      }
      poolEl.replaceChildren();
      pool.forEach(function (o) {
        var c = el('<button class="chip" type="button">' + fmt(o.t) + '</button>');
        c.addEventListener("click", function () { if (locked) return; pool = pool.filter(function (x) { return x !== o; }); placed.push(o); draw(); });
        poolEl.appendChild(c);
      });
      chk.disabled = placed.length !== n;
    }
    draw();
    chk.addEventListener("click", function () {
      locked = true; chk.remove();
      var ok = placed.every(function (o, k) { return o.k === k; });
      Array.prototype.forEach.call(slots.children, function (sl, k) { sl.classList.add(placed[k].k === k ? "ok" : "no"); });
      poolEl.remove();
      var correct = q.items.map(function (t, k) { return ar(k + 1) + ") " + plain(t); }).join("، ");
      record(card, idx, { n: idx + 1, q: q.q, ok: ok, why: q.why }, ok ? "" : "الترتيب الصحيح: " + esc(correct));
    });
  }

  /* ---------- النتيجة ومراجعة الأخطاء ---------- */
  function message(score, total, wrong) {
    var pct = Math.round(score / total * 100);
    var t = "السلام عليكم ورحمة الله.\nأنا: " + name + "\nالتمرين: الدرس " + META.no + " (" + META.lesson + ")\nنتيجتي: " + ar(score) + " من " + ar(total) + " (" + ar(pct) + "٪)";
    t += wrong.length ? "\nالأسئلة التي أخطأت فيها: " + wrong.map(function (w) { return ar(w.n); }).join("، ") : "\nلم أخطئ في أي سؤال، والحمد لله.";
    return t;
  }
  function finish() {
    finished = true; mode = "results"; navNext = null;
    leaveBox.hidden = true;
    reviewList = [];
    res.forEach(function (r, k) { if (r && !r.ok) reviewList.push(k); });
    if (!resultsNode) resultsNode = buildResults();
    mount(resultsNode);
    toTop();
  }
  function buildResults() {
    var total = qs.length;
    var score = res.filter(function (r) { return r && r.ok; }).length;
    var wrong = reviewList.map(function (k) { return res[k]; });
    var pct = score / total;
    var verdict = pct >= 0.9 ? "ممتاز، بارك الله فيك." : pct >= 0.7 ? "جيد جداً. راجع الأسئلة التي أخطأت فيها." : pct >= 0.5 ? "جيد. تحتاج إلى مراجعة الدرس ثم إعادة التمرين." : "راجع الدرس مع المعلم ثم أعد المحاولة.";
    var msg = message(score, total, wrong);
    var wrap = flow();

    var card = el('<section class="card"><span class="qtype">انتهى التمرين</span>' +
      '<div class="score"><span class="big">' + ar(score) + '</span><span class="of">من ' + ar(total) + '</span></div>' +
      '<p class="qtext">' + esc(name) + '، ' + verdict + '</p></section>');
    wrap.appendChild(card);

    if (wrong.length) {
      var rev = el('<section class="card"><h2>الأسئلة التي أخطأت فيها</h2>' +
        '<p class="hint">اضغط على أي سؤال لتراجع إجابتك والإجابة الصحيحة والشرح.</p><div class="review"></div></section>');
      var box = rev.querySelector(".review");
      reviewList.forEach(function (idx, pos) {
        var w = res[idx];
        var b = el('<button class="wrow" type="button"><span class="rn">السؤال ' + ar(w.n) + '</span><span class="wq">' + fmt(w.q) + '</span></button>');
        b.addEventListener("click", function () { review(pos); });
        box.appendChild(b);
      });
      wrap.appendChild(rev);
    }

    var send = el('<section class="card"><h2>أرسل نتيجتك إلى المعلم</h2>' +
      '<p class="hint">النتيجة لا تصل إلى المعلم تلقائياً. اضغط زر واتساب لإرسال الرسالة، أو انسخها وأرسلها بأي تطبيق.</p>' +
      '<textarea class="msg" id="msg" readonly></textarea>' +
      '<div class="actions"><a class="btn" id="wa" target="_blank" rel="noopener">إرسال عبر واتساب</a>' +
      '<button class="btn ghost" id="cp" type="button">نسخ الرسالة</button></div></section>');
    wrap.appendChild(send);
    var ta = send.querySelector("#msg"); ta.value = msg;
    send.querySelector("#wa").href = "https://wa.me/" + (TEACHER_PHONE || "") + "?text=" + encodeURIComponent(msg);
    var cp = send.querySelector("#cp");
    cp.addEventListener("click", function () {
      var done = function () { cp.textContent = "تم النسخ"; setTimeout(function () { cp.textContent = "نسخ الرسالة"; }, 1800); };
      var fallback = function () { ta.focus(); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { cp.textContent = "حدّد الرسالة وانسخها يدوياً"; } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(done, fallback); else fallback();
    });

    var again = el('<button class="btn ghost" type="button">إعادة التمرين</button>');
    again.addEventListener("click", function () { begin(true); });
    wrap.appendChild(again);
    return wrap;
  }
  // مراجعة سؤال أخطأ فيه الطالب، مع التنقل بين الأسئلة الخاطئة فقط
  function review(pos) {
    mode = "review"; navNext = null;
    var idx = reviewList[pos];
    var wrap = flow();
    wrap.appendChild(el('<div class="revbar"><span>مراجعة سؤال أخطأت فيه</span><span>' + ar(pos + 1) + ' من ' + ar(reviewList.length) + '</span></div>'));
    wrap.appendChild(cards[idx]);
    var bar = el('<div class="nav"><button class="btn ghost" type="button">السابق</button><button class="btn" type="button">التالي</button></div>');
    var prev = bar.children[0], next = bar.children[1];
    prev.disabled = pos === 0;
    next.disabled = pos === reviewList.length - 1;
    prev.addEventListener("click", function () { review(pos - 1); });
    next.addEventListener("click", function () { review(pos + 1); });
    wrap.appendChild(bar);
    var back = el('<button class="btn ghost" type="button">العودة إلى النتيجة</button>');
    back.addEventListener("click", function () { mode = "results"; mount(resultsNode); toTop(); });
    wrap.appendChild(back);
    mount(wrap);
    toTop();
  }

  start();
})();
</script>

</html>
